<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Yatra" />
  <meta name="application-name" content="Yatra" />
  <meta name="theme-color" content="#EA2330" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Yatra — flights, hotels, holidays, buses and trains" />
  <title>Yatra</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css?v=8" />
  <script>
    (function () {
      var B = "8";
      try {
        if (localStorage.getItem("yatra.build") === B) return;
        localStorage.setItem("yatra.build", B);
      } catch (e) { return; }
      var left = 1;
      function done() { if (--left <= 0) location.reload(); }
      if (navigator.serviceWorker) {
        left++;
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(done, done);
      }
      if (window.caches) {
        left++;
        caches.keys()
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          .then(done, done);
      }
      done();
    })();
  </script>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="app" id="app"></div>
      <nav class="tabbar hidden" id="tabbar"></nav>
      <div class="toast" id="toast"></div>
      <div class="splash" id="splash">
        <img src="assets/yatra-logo.svg" alt="Yatra" />
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
